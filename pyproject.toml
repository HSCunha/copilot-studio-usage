[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-studio-usage-collector"
version = "0.3.1"
description = "Minimal collector for Copilot Studio agent usage (Dataverse engagement + PPAC credits) into Databricks Delta."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "azure-identity>=1.17",
    "PowerPlatform-Dataverse-Client>=1.1,<2",
]

[project.optional-dependencies]
delta = ["deltalake>=0.18", "polars>=1.0", "pyarrow>=14"]
webapi = ["msal>=1.28"]
backend = ["azure-functions>=1.18"]
config = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
csu = "csu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
